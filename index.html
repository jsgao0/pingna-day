    <script>
      window.addEventListener('load', () => {
        const saved = localStorage.getItem('lang');
        const nav = (navigator.language || '').toLowerCase();
        const lang = saved || (nav.startsWith('zh') ? 'zh' : 'en');
        setTimeout(() => location.replace('/' + lang + '/'), 1000);
      });
    </script>
